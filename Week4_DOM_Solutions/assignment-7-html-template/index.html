<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template Rendering</title>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <h1>Template Song List</h1>
      <ul id="songs"></ul>
      <template id="song-template"
        ><li class="song">
          <span class="title"></span><span class="artist"></span
          ><span class="duration"></span
          ><button class="like" type="button">Like</button
          ><button class="remove" type="button">Remove</button>
        </li></template
      >
    </main>
  </body>
</html>
