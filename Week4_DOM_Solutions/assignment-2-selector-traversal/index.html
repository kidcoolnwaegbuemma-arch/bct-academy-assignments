<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selector Challenge</title>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <h1>My Playlist</h1>
      <section>
        <h2 id="now-playing">Now playing</h2>
        <ul class="songs">
          <li class="song liked" data-id="1">
            <span class="title">Golden Hour</span> —
            <span class="artist">JVKE</span> <button class="like">Like</button>
          </li>
          <li class="song" data-id="2">
            <span class="title">Calm Down</span> —
            <span class="artist">Rema</span> <button class="like">Like</button>
          </li>
          <li class="song liked" data-id="3">
            <span class="title">Essence</span> —
            <span class="artist">Wizkid</span>
            <button class="like">Like</button>
          </li>
          <li class="song" data-id="4">
            <span class="title">Unavailable</span> —
            <span class="artist">Davido</span>
            <button class="like">Like</button>
          </li>
        </ul>
        <p id="song-count"></p>
        <p id="liked-count"></p>
        <p id="titles"></p>
      </section>
    </main>
  </body>
</html>
