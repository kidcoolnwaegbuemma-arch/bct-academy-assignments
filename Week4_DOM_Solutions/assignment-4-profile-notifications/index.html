<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Dashboard</title>
    <link rel="stylesheet" href="../shared.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <h1>Profile Dashboard</h1>
      <section class="song">
        <img id="avatar" src="https://placehold.co/80" alt="Profile avatar" />
        <h2 id="profile-name">bab</h2>
        <p>Status: online<span id="status"></span></p>
        <a id="profile-link">View profile</a>
      </section>
      <h2>Notifications <span id="badge" class="badge">0</span></h2>
      <ul id="notifications">
        <li class="notification unread">Someone mentioned you</li>
        <li class="notification unread">You have a new message</li>
        <li class="notification">A user mentioned your post</li>
      </ul>
      <button id="theme-button" type="button" aria-pressed="false">
        Switch to dark theme
      </button>
      <button id="read-all" type="button">Mark all as read</button>
    </main>
  </body>
</html>
